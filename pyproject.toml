[project]
name = "frame-curator"
version = "0.1.0"
description = "A hand-vetted, family-safe public-domain art gallery for Samsung The Frame: harvest from open-access museums, eyeball every piece on contact sheets, upload only what you approved, keep a manifest."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "John Aselton" }]
keywords = ["samsung", "the-frame", "art-mode", "public-domain", "museum", "open-access", "family-safe"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Graphics",
  "Topic :: Home Automation",
]
dependencies = [
  "httpx>=0.27",
  "pillow>=10",
  "python-dotenv>=1.0",
  "samsungtvws[async]>=2.6",
]

[project.scripts]
frame-curate = "frame_curator.curate:main"
frame-fill = "frame_curator.fill:main"
frame-setup = "frame_curator.setup:main"

[project.urls]
Homepage = "https://github.com/jaselton/frame-curator"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["frame_curator"]
